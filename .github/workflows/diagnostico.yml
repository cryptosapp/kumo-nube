name: Diagnóstico Kumo

on:
  workflow_dispatch:

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: runner/requirements.txt
      - run: pip install -q -r runner/requirements.txt
      - name: Revisar exchange, IA y nube
        env:
          KUMO_APP_TOKEN: ${{ secrets.KUMO_APP_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          IA_URL: ${{ secrets.IA_URL }}
          IA_MODELOS: ${{ secrets.IA_MODELOS }}
          IA_CLAVE: ${{ secrets.IA_CLAVE }}
          EXCHANGE_ID: ${{ secrets.EXCHANGE_ID }}
          EXCHANGE_API_KEY: ${{ secrets.EXCHANGE_API_KEY }}
          EXCHANGE_SECRET: ${{ secrets.EXCHANGE_SECRET }}
          EXCHANGE_PASSWORD: ${{ secrets.EXCHANGE_PASSWORD }}
        run: python runner/diagnostico.py
